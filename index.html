  <body>
    <div id="splash-screen"></div>
    <script>
      (function removeSplashImmediately() {
        const splash = document.getElementById('splash-screen');
        if (!splash) return;
        if (document.readyState !== 'loading') {
          splash.remove();
        } else {
          document.addEventListener('readystatechange', () => {
            if (document.readyState === 'interactive' || document.readyState === 'complete') {
              splash.remove();
            }
          });
          window.addEventListener('load', () => {
            splash.remove();
          });
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/error/inapp.js"></script>
    <script defer>
      var inappdeny_exec_vanillajs = (callback) => {
        if (document.readyState !== 'loading') {
          callback();
        } else {
          document.addEventListener('DOMContentLoaded', callback);
        }
      };
      inappdeny_exec_vanillajs(() => {
        /* Do things after DOM has fully loaded */

        var useragt = navigator.userAgent.toLowerCase();
        var target_url = location.href;

        if (useragt.match(/kakaotalk/i)) {
          //카카오톡 외부브라우저로 호출
          location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(target_url);
        } else if (useragt.match(/line/i)) {
          //라인 외부브라우저로 호출
          if (target_url.indexOf('?') !== -1) {
            location.href = target_url + '&openExternalBrowser=1';
          } else {
            location.href = target_url + '?openExternalBrowser=1';
          }
        } else if (
          useragt.match(
            /inapp|naver|snapchat|wirtschaftswoche|thunderbird|instagram|everytimeapp|whatsApp|electron|wadiz|aliapp|zumapp|iphone(.*)whale|android(.*)whale|kakaostory|band|twitter|DaumApps|DaumDevice\/mobile|FB_IAB|FB4A|FBAN|FBIOS|FBSS|trill|SamsungBrowser\/[^1]/i,
          )
        ) {
          //그외 다른 인앱들 - 외부 브라우저 오픈 유도 페이지 표시
          showInAppBrowserError();
        }
      });
    </script>
